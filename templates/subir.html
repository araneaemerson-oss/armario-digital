{% extends "base.html" %}

{% block contenido %}

    <h1>Subir prenda</h1>
    <p class="subtitulo">Agrega una prenda nueva a tu armario.</p>

    <form method="POST" enctype="multipart/form-data" class="subir-layout">

        <!-- Columna izquierda: la foto -->
        <label for="foto" class="zona-foto">
            <img id="vista-previa" alt="Vista previa de la prenda" hidden>
            <div id="zona-texto" class="zona-texto">
                <span class="zona-icono">📷</span>
                <strong>Haz clic para elegir una foto</strong>
                <span>JPG o PNG · con fondo claro se ve mejor</span>
            </div>
            <input type="file" id="foto" name="foto" accept="image/*" required>
        </label>

        <!-- Columna derecha: los datos -->
        <div class="formulario subir-campos">
            <label for="nombre">Nombre de la prenda</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej.: camisa azul" required>

            <span class="etiqueta">Tipo</span>
            <div class="chips">
                {% for opcion in ["Camisa", "Pantalón", "Zapatos", "Accesorios"] %}
                    <label class="chip">
                        <input type="radio" name="tipo" value="{{ opcion }}" {% if loop.first %}checked{% endif %}>
                        <span>{{ opcion }}</span>
                    </label>
                {% endfor %}
            </div>

            <label for="color">Color</label>
            <input type="text" id="color" name="color" placeholder="Ej.: azul" required>

            <span class="etiqueta">Ocasión</span>
            <div class="chips">
                {% for opcion in ["Casual", "Formal", "Fiesta", "Deporte"] %}
                    <label class="chip">
                        <input type="radio" name="ocasion" value="{{ opcion }}" {% if loop.first %}checked{% endif %}>
                        <span>{{ opcion }}</span>
                    </label>
                {% endfor %}
            </div>

            <button type="submit">Guardar prenda</button>
        </div>
    </form>

    <script>
        // Cuando eliges una foto, la mostramos antes de guardarla
        const inputFoto = document.getElementById("foto");
        inputFoto.addEventListener("change", function () {
            const archivo = inputFoto.files[0];
            if (archivo) {
                const vista = document.getElementById("vista-previa");
                vista.src = URL.createObjectURL(archivo);
                vista.hidden = false;
                document.getElementById("zona-texto").hidden = true;
            }
        });
    </script>

{% endblock %}
