{%extends "base.html"%}

{% block contenido%}

    <h1>Mis Prendas</h1>
    <p>Tienes {{prendas|length}} prendas en tu armario</p>
    
    <div class="grilla">
        {% for prenda in prendas%}
            <div class="tarjeta">
                {% if  prenda.foto%}
                    <img src="{{url_for('static', filename=prenda.foto)}}" alt="{{prenda.nombre}}">
                {% endif%}
                <h2>{{ prenda.nombre }}</h2>
                <p>{{prenda.tipo}} - {{prenda.color}} - {{prenda.ocasion}}</p>
                <form method="POST" action="/borrar/{{prenda.id}}">
                    <button type="submit"> Borrar </button>
                </form>
                <a href="/editar/{{prenda.id}}">Editar</a>

            </div>  
        {%endfor%}
    </div>
 {%endblock%}
