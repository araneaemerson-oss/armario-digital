{% extends "base.html" %}

{% block contenido %}

    <h1>Editar prenda</h1>
    <p class="subtitulo">Cambia los datos o la foto de tu prenda.</p>

    <form method="POST" enctype="multipart/form-data" class="subir-layout">

        <!-- Columna izquierda: la foto (opcional) -->
        <div class="columna-foto">
            <label for="foto" class="zona-foto">
                {% if prenda.foto %}
                    <img id="vista-previa" src="{{ url_for('static', filename=prenda.foto) }}" alt="{{ prenda.nombre }}">
                    <span class="cambiar-foto">📷 Clic para cambiar la foto</span>
                {% else %}
                    <img id="vista-previa" alt="Vista previa de la prenda" hidden>
                    <div id="zona-texto" class="zona-texto">
                        <span class="zona-icono">📷</span>
                        <strong>Haz clic para elegir una foto</strong>
                        <span>JPG o PNG · con fondo claro se ve mejor</span>
                    </div>
                {% endif %}
                <input type="file" id="foto" name="foto" accept="image/*">
            </label>
            {% include "_consejos_foto.html" %}
        </div>

        <!-- Columna derecha: los datos -->
        <div class="formulario subir-campos">
            {% include "_campos_prenda.html" %}

            <button type="submit">Guardar cambios</button>
            <a href="/prendas" class="cancelar">Cancelar</a>
        </div>
    </form>

    {% if prenda.foto and REMBG_DISPONIBLE %}
        <form method="POST" action="/quitar-fondo/{{ prenda.id }}" class="form-quitar-fondo"
              onsubmit="this.querySelector('button').textContent = '⏳ Quitando el fondo...'">
            <button type="submit" class="boton boton-editar boton-grande">✂️ Quitar el fondo de esta foto</button>
        </form>
    {% endif %}

    <script>
        // Cuando eliges una foto nueva, la mostramos antes de guardarla
        const inputFoto = document.getElementById("foto");
        inputFoto.addEventListener("change", function () {
            const archivo = inputFoto.files[0];
            if (archivo) {
                const vista = document.getElementById("vista-previa");
                vista.src = URL.createObjectURL(archivo);
                vista.hidden = false;
                const texto = document.getElementById("zona-texto");
                if (texto) { texto.hidden = true; }
            }
        });
    </script>

{% endblock %}
