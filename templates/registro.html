{% extends "base.html" %}

{% block contenido %}
    <div class="auth">
        <h1>Crear cuenta</h1>
        <p class="subtitulo">Tu armario, tu avatar, tus outfits. ✨</p>

        <form method="POST" class="formulario">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" value="{{ nombre or '' }}" placeholder="Ej.: Ana" required>

            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" value="{{ correo or '' }}" placeholder="tucorreo@ejemplo.com" required>

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Mínimo 6 caracteres" minlength="6" required>

            <button type="submit">Crear mi cuenta</button>
            <p class="auth-pie">¿Ya tienes cuenta? <a href="/entrar">Entra aquí</a></p>
        </form>
    </div>
{% endblock %}
